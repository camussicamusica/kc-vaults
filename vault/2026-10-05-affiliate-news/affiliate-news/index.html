<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KC · Daily affiliate brief</title><style>body{background:#f5f2eb;margin:0;padding:32px 22px}</style></head><body><main id="news"></main><script>/* Public-source daily briefs. No requests, analytics, account access or social actions. */
window.mountKCAffiliateNews = function(root, feed) {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeURL = value => { try { const u = new URL(value); return u.protocol === 'https:' ? u.href : '#'; } catch { return '#'; } };
  const reports = [...feed.reports].sort((a,b) => b.date.localeCompare(a.date));
  const style = `<style>
  .kc-news{color:#28372d;font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:1100px;margin:auto}.kc-news *{box-sizing:border-box}.kc-news h2{font:clamp(30px,4vw,48px)/1.12 Georgia,serif;letter-spacing:-.025em;margin:16px 0}.kc-news h3{font:26px/1.2 Georgia,serif;margin:10px 0 16px}.kc-news .kn-meta{font-size:12px;color:#637065}.kc-news .kn-heading{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center}.kc-news select,.kc-news button{font:inherit;border:1px solid #c4cdbf;border-radius:6px;padding:10px 14px;background:white;color:#28372d;max-width:100%}.kc-news button{cursor:pointer;background:#334f3e;color:white}.kc-news a{color:#334f3e;overflow-wrap:anywhere;text-underline-offset:3px}.kc-news a:focus-visible,.kc-news button:focus-visible,.kc-news select:focus-visible{outline:3px solid #ad6751;outline-offset:3px}.kc-news .kn-card{background:white;border:1px solid #d8ddd2;border-radius:8px;padding:26px;margin:20px 0}.kc-news p{margin:10px 0}.kc-news .kn-tag{color:#ad6751;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.kc-news .kn-action{border-left:3px solid #789471;padding-left:16px}.kc-news .kn-summary{background:#e9eee4;border-radius:8px;padding:26px;margin:28px 0}.kc-news .kn-summary h3{margin-top:0}.kc-news li{margin:9px 0}.kc-news .kn-sources{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:13px;margin-top:15px}.kc-news details{font-size:13px;color:#637065;margin-top:18px}.kc-news summary{cursor:pointer}.kc-news .kn-status{font-size:13px;min-height:22px}.kc-news .kn-muted{color:#637065}.kc-news .kn-foot{border-top:1px solid #d8ddd2;padding-top:18px;font-size:13px}@media(max-width:600px){.kc-news .kn-card,.kc-news .kn-summary{padding:20px}.kc-news h3{font-size:23px}}
  </style>`;
  root.classList.add('kc-news');
  if (!reports.length) {root.innerHTML=style+'<p>No reports are available yet.</p>';return;}
  let current=reports[0];
  function render(id){
    current=reports.find(r=>r.id===id)||reports[0];
    const r=current;
    root.innerHTML=style+`<div class="kn-heading"><p class="kn-tag">Daily affiliate brief · For Casey</p><label class="kn-meta">Report <select aria-label="Choose research report">${reports.map(x=>`<option value="${esc(x.id)}" ${x.id===r.id?'selected':''}>${esc(x.date)}</option>`).join('')}</select></label></div><h2>${esc(r.title)}</h2><p class="kn-meta">Research date: ${esc(r.date)} · Córdoba time</p><p>${esc(r.intro)}</p><p class="kn-meta">${esc(r.scope)}</p>${r.findings.map((f,i)=>`<article class="kn-card"><div class="kn-tag">${i+1}. ${esc(f.topic)}</div><h3>${esc(f.title)}</h3><p>${esc(f.body)}</p><div class="kn-action"><p><strong>Try next:</strong> ${esc(f.action)}</p><p><strong>Measure:</strong> ${esc(f.measure)}</p></div><div class="kn-sources">${f.sources.map(s=>`<a target="_blank" rel="noopener noreferrer" href="${esc(safeURL(s.url))}">${esc(s.label)} ↗</a>`).join('')}</div><details><summary>Evidence and date</summary><p>${esc(f.kind)}</p><p>${esc(f.evidence)}</p><p>${esc(f.source_date)}</p></details></article>`).join('')}<p class="kn-muted"><strong>Needs attention:</strong> ${esc(r.attention)}</p><section class="kn-summary"><h3>TL;DR</h3><ul>${r.tldr.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><button type="button">Copy brief for Casey</button><p class="kn-status" role="status"></p><textarea hidden aria-label="Brief to copy manually" style="width:100%;min-height:240px;margin-top:10px"></textarea></section><div class="kn-foot"><p><strong>Next research focus:</strong> ${esc(r.next_focus)}</p><p>${esc(r.coverage)}</p><p>Public-source brief. Recommendations are for review; no campaigns or accounts were changed.</p></div>`;
    root.querySelector('select').onchange=e=>render(e.target.value);
    root.querySelector('button').onclick=async()=>{
      const text=[r.title,r.date,r.intro,...r.findings.map(f=>`${f.title}\n${f.body}\nTry next: ${f.action}\nMeasure: ${f.measure}\nEvidence: ${f.evidence}\n${f.source_date}\n${f.sources.map(s=>s.url).join('\n')}`),`Needs attention: ${r.attention}`,'TL;DR',...r.tldr.map(t=>'• '+t)].join('\n\n');
      const status=root.querySelector('.kn-status');
      try{await navigator.clipboard.writeText(text);status.textContent='Copied. Ready for you to share.'}catch{const box=root.querySelector('textarea');box.hidden=false;box.value=text;box.focus();box.select();status.textContent='Select and copy the brief below.'}
    };
  }
  render(current.id);
};
